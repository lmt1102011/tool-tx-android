name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Grant wrapper exec (chuẩn bị nếu setup-gradle sinh wrapper)
        run: chmod +x ./gradlew 2>/dev/null || true

      - name: Generate wrapper (project chưa đóng gói gradlew — dùng dist do setup-gradle cài tại GRADLE_HOME)
        run: |
          if [ ! -x ./gradlew ]; then
            "${GRADLE_HOME}/bin/gradle" wrapper --gradle-version 8.11.1 --no-daemon
          fi
          chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
